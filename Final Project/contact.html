<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Me</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->
    <nav class="site-nav">
      <div class="nav-inner">
        <a class="nav-brand" href="home.html">Build <span>Your PC</span></a>

        <div class="nav-links">
          <a class="nav-btn" href="home.html">Home</a>
          <a class="nav-btn" href="home.html#beginner">Beginner</a>
          <a class="nav-btn" href="home.html#intermediate">Intermediate</a>
          <a class="nav-btn" href="home.html#pro">Pro</a>
          <a class="nav-build active" href="contact.html">Contact Me</a>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h1 class="mb-4">Contact Me</h1>

      <form id="contactForm" class="p-4 border rounded shadow-sm">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input id="name" type="text" class="form-control" required />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" required />
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea
            id="message"
            class="form-control"
            rows="4"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-success">Send Message</button>

        <p id="formMessage" class="mt-3 text-success d-none">
          Thanks! Your message has been sent.
        </p>
      </form>
    </main>
    <footer class="site-footer">
      <p>© 2025 Build Your PC • Matt Metcalfe</p>
    </footer>
    <script src="js/contact.js"></script>
  </body>
</html>
